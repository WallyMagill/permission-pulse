name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Test SwiftPM packages
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test PermissionsCore
        run: swift test --package-path Packages/PermissionsCore

      - name: Test PermissionsScanners
        run: swift test --package-path Packages/PermissionsScanners

      - name: Test PermissionsStore
        run: swift test --package-path Packages/PermissionsStore

      - name: Test PermissionsUI
        run: swift test --package-path Packages/PermissionsUI

  app:
    name: Build and test app target
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test app target
        env:
          PERMISSION_PULSE_TEST_MODE: "1"
        run: |
          xcodebuild test \
            -project PermissionPulse/PermissionPulse.xcodeproj \
            -scheme PermissionPulse \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:PermissionPulseTests CODE_SIGNING_ALLOWED=NO

      - name: Analyze app target
        run: |
          xcodebuild analyze \
            -project PermissionPulse/PermissionPulse.xcodeproj \
            -scheme PermissionPulse -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO

      - name: Verify smoke preservation
        run: scripts/tests/smoke-test-safety-test.sh

      - name: Build and verify release artifact
        run: |
          scripts/package-release.sh 0.7.2 "$RUNNER_TEMP/permission-pulse-release"
          scripts/verify-release.sh \
            "$RUNNER_TEMP/permission-pulse-release/PermissionPulse-v0.7.2.app.zip" \
            0.7.2 12
