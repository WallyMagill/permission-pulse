name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Test SwiftPM packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          swift --version
          sw_vers

      - name: Test PermissionsCore
        run: swift test --package-path Packages/PermissionsCore

      - name: Test PermissionsScanners
        run: swift test --package-path Packages/PermissionsScanners

      - name: Test PermissionsStore
        run: swift test --package-path Packages/PermissionsStore

      - name: Test PermissionsUI
        run: swift test --package-path Packages/PermissionsUI

  app:
    name: Build and test app target
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version

      # The Xcode test targets (PermissionPulseTests, PermissionPulseUITests)
      # are intentionally empty no-op hosts (see docs/03-architecture.md).
      # Real test coverage lives in the SwiftPM packages, exercised by the
      # `packages` job above. The app job only verifies the .xcodeproj
      # still compiles. We don't invoke `test` here because the app target
      # requires macOS 26 (Tahoe) and GitHub's macos-latest runner is on
      # macOS 15.
      - name: Build (Debug)
        run: |
          xcodebuild \
            -project PermissionPulse/PermissionPulse.xcodeproj \
            -scheme PermissionPulse \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
