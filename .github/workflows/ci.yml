name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two toolchain legs. `macos-26` is the supported floor toolchain; `xcode-27`
# matches the release Mac (macOS 27, Xcode 27.2). The `xcode-27` runner image
# was marked "Preview" in actions/runner-images on 2026-11-13.
jobs:
  packages:
    name: Test SwiftPM packages (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macOS 26 / Xcode 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.5.app
          - leg: macOS 27 / Xcode 27.2
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode is installed
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "FAIL: expected Xcode at $DEVELOPER_DIR, which does not exist on this runner."
            echo "Installed Xcode apps:"
            ls -d /Applications/Xcode_*.app || echo "(none)"
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test PermissionsCore
        run: swift test --package-path Packages/PermissionsCore

      - name: Test PermissionsScanners
        run: swift test --package-path Packages/PermissionsScanners

      - name: Test PermissionsStore
        run: swift test --package-path Packages/PermissionsStore

      - name: Test PermissionsUI
        run: swift test --package-path Packages/PermissionsUI

  app:
    name: Build and test app target (${{ matrix.leg }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: macOS 26 / Xcode 26.5
            runner: macos-26
            xcode: /Applications/Xcode_26.5.app
          - leg: macOS 27 / Xcode 27.2
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Check Xcode is installed
        run: |
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "FAIL: expected Xcode at $DEVELOPER_DIR, which does not exist on this runner."
            echo "Installed Xcode apps:"
            ls -d /Applications/Xcode_*.app || echo "(none)"
            exit 1
          fi

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Read version from Config/Version.xcconfig
        id: version
        run: |
          read_key() {
            awk -F= -v key="$1" '
              $1 ~ "^[[:space:]]*" key "[[:space:]]*$" {
                value = $2
                sub(/^[[:space:]]*/, "", value)
                sub(/[[:space:]]*$/, "", value)
                print value
              }
            ' Config/Version.xcconfig
          }
          version=$(read_key MARKETING_VERSION)
          build=$(read_key CURRENT_PROJECT_VERSION)
          if [[ -z "$version" || -z "$build" ]]; then
            echo "FAIL: Config/Version.xcconfig must set MARKETING_VERSION and CURRENT_PROJECT_VERSION (got version='$version', build='$build')."
            exit 1
          fi
          echo "Version $version, build $build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Test app target
        env:
          PERMISSION_PULSE_TEST_MODE: "1"
        run: |
          xcodebuild test \
            -project PermissionPulse/PermissionPulse.xcodeproj \
            -scheme PermissionPulse \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:PermissionPulseTests CODE_SIGNING_ALLOWED=NO

      - name: Analyze app target
        run: |
          xcodebuild analyze \
            -project PermissionPulse/PermissionPulse.xcodeproj \
            -scheme PermissionPulse -configuration Debug \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO

      - name: Verify smoke preservation
        run: scripts/tests/smoke-test-safety-test.sh

      - name: Build and verify release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          scripts/package-release.sh "$VERSION" "$RUNNER_TEMP/permission-pulse-release"
          scripts/verify-release.sh \
            "$RUNNER_TEMP/permission-pulse-release/PermissionPulse-v$VERSION.app.zip" \
            "$VERSION" "$BUILD"
